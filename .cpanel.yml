---
# GANTI "GANTI_USERNAME" dan path di bawah sesuai akun cPanel-mu.
# DEPLOYPATH = folder LIVE yang udah dipakai domain mifda.my.id sekarang
# (BUKAN folder clone repo-nya — itu folder staging terpisah, lihat
# PANDUAN-GITHUB-AUTODEPLOY.md bagian "Repository Path").
#
# Kalau "php"/"composer" di bawah error "command not found" pas deploy,
# ganti ke path lengkap (cek di cPanel > Select PHP Version, biasanya
# polanya /opt/cpanel/ea-php81/root/usr/bin/php untuk PHP 8.1).
deployment:
  tasks:
    - export DEPLOYPATH=/home/GANTI_USERNAME/mifda.my.id/
    - /bin/cp -R * $DEPLOYPATH
    - cd $DEPLOYPATH && composer install --no-dev --optimize-autoloader --no-interaction
    - cd $DEPLOYPATH && php artisan migrate --force
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache
