name: Deploy Mifda ke cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy di cPanel
        uses: pinkasey/cpanel-deploy-action@v1.0.0
        with:
          hostname: ${{ secrets.CPANEL_HOSTNAME }}
          repository_root: ${{ secrets.CPANEL_REPO_PATH }}
          branch: main
          cpanel_username: ${{ secrets.CPANEL_USERNAME }}
          cpanel_token: ${{ secrets.CPANEL_TOKEN }}
